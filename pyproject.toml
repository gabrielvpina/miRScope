[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mirscope"
version = "0.4.0"
description = "Comparative analysis and evolutionary conservation of microRNAs."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Tatyana Chagas Moura / BiovirLab" }]
dependencies = [
    "biopython",
]

[project.optional-dependencies]
dev = ["pytest"]

# Registers the terminal command.
[project.scripts]
mirscope = "mirscope.cli:main"

[tool.setuptools.packages.find]
include = ["mirscope*"]
exclude = ["mirscope.test*"]

# Ship the bundled reference FASTA database and the HTML report components
# (template, CSS, JS, vendored D3, logo) so they resolve inside a wheel install.
[tool.setuptools.package-data]
mirscope = [
    "data/*.fasta", "data/*.fa",
    "components/*", "vendor/*", "assets/*.png",
]
