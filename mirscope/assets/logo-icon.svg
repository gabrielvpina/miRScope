<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="miRScope">
  <title>miRScope</title>
  <rect width="64" height="64" rx="14" fill="#3b4a2a"/>
  <!-- magnifier handle -->
  <line x1="39.5" y1="39.5" x2="51" y2="51" stroke="#b9cf86" stroke-width="6.5" stroke-linecap="round"/>
  <!-- lens -->
  <circle cx="27" cy="27" r="16" fill="#2a3520" stroke="#b9cf86" stroke-width="4"/>
  <!-- miRNA hairpin: base pairs -->
  <g stroke="#7f9654" stroke-width="1.6" stroke-linecap="round">
    <line x1="22" y1="25.5" x2="32" y2="25.5"/>
    <line x1="22" y1="29.5" x2="32" y2="29.5"/>
    <line x1="22" y1="33.5" x2="32" y2="33.5"/>
  </g>
  <!-- strands + terminal loop -->
  <path d="M22 39 V21 A5 5 0 0 1 32 21 V36.5" fill="none" stroke="#e9eedb" stroke-width="2.4" stroke-linecap="round"/>
  <!-- seed region (nt 2-8) on the 5' strand -->
  <path d="M22 37 V24.5" fill="none" stroke="#c2a86b" stroke-width="3.6" stroke-linecap="round"/>
</svg>
